name: Auto Release

on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version aus Plugin-Header lesen
        id: version
        run: |
          VERSION=$(grep -m1 '^ \* Version:' opening-hours-holidays.php | sed 's/.*Version: *//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Prüfen ob Tag bereits existiert
        id: tag_check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Plugin-ZIP bauen
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          SLUG=opening-hours-holidays
          mkdir -p "build/$SLUG"
          rsync -a --exclude-from='.distignore' ./ "build/$SLUG/"
          (cd build && zip -r "../$SLUG-${{ steps.version.outputs.version }}.zip" "$SLUG")

      - name: Release erstellen
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "opening-hours-holidays-${{ steps.version.outputs.version }}.zip" \
            --title "${{ steps.version.outputs.tag }}" \
            --latest
